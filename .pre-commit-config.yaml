# Checks run before each commit, and by CI.
# The code quality hooks run the tools from the project's virtual environment, so the versions pinned
# in requirements-dev.txt are the only versions. Activate the environment before committing.
# gitleaks is a Go program, so it's pinned here by its release tag instead. pre-commit builds it on
# first use, and CI's secrets job reads this rev to download the same release.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format --check
        entry: ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: mypy
        # Checks the whole project, so a change that breaks a caller in another module is caught.
        entry: mypy
        language: system
        types: [python]
        pass_filenames: false
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # Scans the staged changes, with secret values redacted.
      - id: gitleaks
