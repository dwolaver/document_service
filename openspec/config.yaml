schema: spec-driven
githubCopilot:
  cloudAgent: false

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours
rules:
  tasks:
    - >-
      In the Workflow follow-up section, use this normal flow: after apply, the repository owner
      reviews the code and CI runs on the pull request; any changes are made before archive, in
      the active change; archive on the same branch as the last step, which makes the change
      complete; the repository owner then merges as long as CI still passes, so that the code,
      spec and archive land as one commit on main.
    - >-
      Depart from that flow only when a change has work that can only happen after merge. State
      the reason in the Workflow follow-up section, and add the merge-before-archive label to its
      pull request.

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
