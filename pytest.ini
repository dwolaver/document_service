[pytest]
# The release script's tests import it from scripts/ at the repository root.
pythonpath = .
# Tests mirror the rfc_qa package in subfolders. importlib mode imports each test file under a name
# taken from its path, so the same file name can appear in more than one folder.
addopts = --import-mode=importlib
markers =
    integration: tests that require network access (set RFC_DOWNLOADER_NETWORK_TESTS=1)
    ollama: tests that need Ollama, llama3.2 and a built index (set OLLAMA_TESTS=1)
