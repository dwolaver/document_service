[pytest]
# The release script's tests import it from scripts/ at the repository root. The rfc_qa package is
# imported from the editable install, so src/ isn't added here.
pythonpath = .
# Tests mirror the rfc_qa package in src/rfc_qa in subfolders. importlib mode imports each test file
# under a name taken from its path, so the same file name can appear in more than one folder.
addopts = --import-mode=importlib
markers =
    integration: tests that require network access (set RFC_DOWNLOADER_NETWORK_TESTS=1)
    ollama: tests that need Ollama, llama3.2 and a built index (set OLLAMA_TESTS=1)
    install: tests that build a wheel and install it in a fresh environment (set RFC_QA_INSTALL_TESTS=1)
