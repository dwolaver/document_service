[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rfc-qa"
version = "0.1.0"
description = "Answer questions from the RFCs with checked citations."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["requests"]

[project.scripts]
rfc-ingest = "rfc_qa.ingestion.ingest:main"
rfc-query = "rfc_qa.query:main"
rfc-search = "rfc_qa.retrieval.keyword_index:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["rfc_qa*"]

[tool.ruff]
line-length = 110
# Python files only. ruff also formats code blocks in Markdown by default, which would reach the
# archived OpenSpec records.
include = ["*.py"]

[tool.ruff.lint]
# pyflakes and pycodestyle errors, plus import sorting and bugbear. Listed explicitly, because ruff's
# own default set is broader and changes between releases.
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
# The package is in src/. mypy doesn't follow the editable install, so it looks there directly.
mypy_path = "src"
files = ["src", "scripts", "tests"]
explicit_package_bases = true
warn_unused_configs = true
strict = true
# A type: ignore must name the error it suppresses. strict also fails one that isn't needed.
enable_error_code = ["ignore-without-code"]

# Tests don't need annotations, but the bodies of their functions are still checked.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
check_untyped_defs = true
